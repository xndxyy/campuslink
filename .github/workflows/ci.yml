name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: campuslink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campuslink_test
          POSTGRES_PASSWORD: campuslink_test_password
          POSTGRES_USER: campuslink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuslink -d campuslink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.28
        ports:
          - 1025:1025
          - 8025:8025
    env:
      ALLOW_DESTRUCTIVE_E2E: 'true'
      AI_ALLOWED_HOSTS: api.openai.com
      AI_CONFIG_ENCRYPTION_KEY_V1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ANONYMOUS_FINGERPRINT_KEY: MjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjI=
      ANONYMOUS_IDENTITY_KEY_V1: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://campuslink:campuslink_test_password@127.0.0.1:5432/campuslink_test
      E2E_PUBLISHED_MARKETPLACE_ID: e2e-published-marketplace
      E2E_OTHER_EMAIL: seller@campuslink.test
      E2E_OTHER_PASSWORD: CampusLinkSeller2026!
      E2E_REJECTED_ID: e2e-rejected-resource
      E2E_REJECTED_KIND: resource
      E2E_UNVERIFIED_EMAIL: pending@campuslink.test
      E2E_UNVERIFIED_PASSWORD: CampusLinkPending2026!
      E2E_VERIFIED_EMAIL: student@campuslink.test
      E2E_VERIFIED_PASSWORD: CampusLinkE2E2026!
      MAIL_FROM: CampusLink CI <noreply@campuslink.test>
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      S3_ACCESS_KEY_ID: campuslink_minio
      S3_BUCKET: campuslink
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: campuslink_minio_test_password
      SMTP_HOST: 127.0.0.1
      SMTP_PASSWORD: ci-mail-password
      SMTP_PORT: '1025'
      SMTP_USER: ci-mail-user
      TRUST_PROXY: 'false'
      UPLOAD_CLEANUP_SECRET: 0123456789abcdef0123456789abcdef
      UPLOAD_SCANNER_CALLBACK_SECRET: abcdef0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: 22.12.0
      - run: npm ci
      - name: Start MinIO
        run: >-
          docker run -d --name campuslink-minio
          -p 9000:9000
          -e MINIO_ROOT_USER=campuslink_minio
          -e MINIO_ROOT_PASSWORD=campuslink_minio_test_password
          -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:3000
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Create storage bucket
        run: |
          for attempt in {1..30}; do
            if docker run --rm --network host \
              -e MC_HOST_local="http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@127.0.0.1:9000" \
              minio/mc:RELEASE.2025-08-13T08-35-41Z \
              mb --ignore-existing local/campuslink; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify Mailpit service
        run: curl --fail --retry 20 --retry-delay 1 http://127.0.0.1:8025/api/v1/info
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Build with production security policy
        run: npm run build
        env:
          APP_URL: https://campus.example.test
          DATABASE_URL: postgresql://campuslink:campuslink_test_password@127.0.0.1:5432/campuslink_test?sslmode=require
          NEXT_PUBLIC_APP_URL: https://campus.example.test
          S3_ENDPOINT: https://objects.example.test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:provision
      - name: Smoke test production server
        env:
          APP_URL: https://campus.example.test
          DATABASE_URL: postgresql://campuslink:campuslink_test_password@127.0.0.1:5432/campuslink_test?sslmode=require
          NEXT_PUBLIC_APP_URL: https://campus.example.test
          S3_ENDPOINT: https://objects.example.test
        run: |
          npm start > /tmp/campuslink-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:3000/auth/sign-in; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/campuslink-next.log
          exit 1
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: playwright-report/
