services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuslink}
      POSTGRES_USER: ${POSTGRES_USER:-campuslink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslink_dev_password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campuslink_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campuslink_minio_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000
      $${MINIO_ROOT_USER:-campuslink_minio}
      $${MINIO_ROOT_PASSWORD:-campuslink_minio_dev_password}; do sleep 1; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET:-campuslink}"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-campuslink}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campuslink_minio_dev_password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campuslink_minio}

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
  minio-data:
