services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuslink}
      POSTGRES_USER: ${POSTGRES_USER:-campuslink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslink_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campuslink_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campuslink_minio_dev_password}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
